name: even-effort-pace-chart
displayName: 越野跑体感一致配速表
slug: even-effort-pace-chart
version: 1.0.6
description: "基于耐力学社体感一致配速思路的独立实现。把 GPX/KML 路线或 FIT 轨迹转换成按检查点分段的体感一致越野跑配速表，或把 FIT 活动与 checkpoint 方案对照，查看累计差距、分段耗时与地形差异。仓库地址：https://github.com/yihouzenmeban/trail-running-pace"
summary: "赛前生成多目标越野跑配速表（SVG）；赛后对照实际与方案，输出比较图与分段差值。"
author: yihouzenmeban
category: development
tags:
  - 越野跑
  - 配速表
  - GPX
  - KML
  - FIT
  - 耐力运动
triggers:
  - 生成配速表
  - 体感一致配速表
  - 越野跑配速表
  - 越野跑赛后对照
  - pace chart
  - 赛后对照
  - 活动对比
license: MIT
homepage: https://github.com/yihouzenmeban/trail-running-pace
icon: icon.png
permissions:
  - GPX/KML 配速表需要 Python 3.10+，无需第三方依赖
  - FIT 输入与活动对比需要安装 Python 可选依赖（scripts/requirements-comparison.txt）
  - 按需获取天气预报时，会向 Open-Meteo 发送各赛段中点的经纬度
  - compare_activity.py 的 list/fetch 子命令会按需访问 Garmin Connect 以列出或下载活动
